<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" aria-label="A Telegram chat: a request is sent, a single status message updates in place while tools run, it disappears, and the finished answer arrives — then a permission request is approved with yes.">
<style>
